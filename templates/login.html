<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | Libra♥Track</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: "Segoe UI", Arial, sans-serif;
            background: linear-gradient(135deg, #FFF1F4, #E6E6FA);
            color: #5F4B4F;
        }

        .login-card {
            width: 90%;
            max-width: 420px;
            background: white;
            padding: 42px;
            border-radius: 25px;
            box-shadow: 0 20px 50px rgba(130, 85, 95, 0.12);
            border: 1px solid #F0D8D8;
        }

        .logo {
            text-align: center;
            font-size: 28px;
            font-weight: 800;
            color: #C56B82;
            margin-bottom: 8px;
        }

        .logo span {
            color: #A78BBA;
        }

        h1 {
            text-align: center;
            color: #5B4650;
            margin: 20px 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #89767C;
            margin-bottom: 30px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-weight: 600;
        }

        input {
            width: 100%;
            padding: 14px;
            margin-bottom: 18px;
            border: 1px solid #E8D5D8;
            border-radius: 12px;
            outline: none;
            font-size: 15px;
        }

        input:focus {
            border-color: #C56B82;
        }

        button {
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 13px;
            background: #C56B82;
            color: white;
            font-size: 16px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover {
            background: #B85D75;
        }

        .error {
            background: #FFF0F2;
            color: #B85D75;
            padding: 10px;
            border-radius: 10px;
            margin-bottom: 18px;
            text-align: center;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 22px;
            text-decoration: none;
            color: #765F91;
            font-weight: 600;
        }
    </style>
</head>

<body>

<div class="login-card">

    <div class="logo">Libra<span>♥</span>Track</div>

    <h1>Admin Login</h1>

    <p class="subtitle">
        Sign in to manage your library
    </p>

    {% if error %}
        <div class="error">{{ error }}</div>
    {% endif %}

    <form method="POST">

        <label>Username</label>
        <input
            type="text"
            name="username"
            placeholder="Enter username"
            required
        >

        <label>Password</label>
        <input
            type="password"
            name="password"
            placeholder="Enter password"
            required
        >

        <button type="submit">
            Login
        </button>

    </form>

    <a href="/" class="back">← Back to Home</a>

</div>

</body>
</html>
